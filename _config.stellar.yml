# =================================================================
# 咕咕嘎嘎の小屋 - Stellar 官方大背景终极完美毕业版配置
# =================================================================

site:
  avatar: /images/avatar.jpg

style:
  # 🏢 左侧侧边栏：微光磨砂玻璃，带有一点点朦胧夜景
  leftbar:
    background-image: url(/images/bg3.jpg)
    background-opacity: 0.25 
    blur-px: 15px                        
    background-position: right bottom    
  
  # 💻 全站大背景（在这里微调收尾！）
  site:
    background-image: url(/images/bg3.jpg)
    blur-px: 0px                         
    
    # 🌟 1. 锁死高度：不管屏幕多宽，图片高度雷打不动等于屏幕高（100vh），女孩绝不变成大头贴！
    background-size: 'auto 100vh !important'
    
    # 🌟 2. 完美对齐：把原先太靠右的 95% 换成更温和的 78%。
    # 这样女孩会优雅地待在内容大框的右后方，既不被切掉，也不会让右边显得太挤！
    background-position: '78% bottom !important'