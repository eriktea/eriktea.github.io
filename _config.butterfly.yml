# highlight_theme: mac light #  darker -- 较深的颜色主题 / pale night -- 浅黑色或夜间模式 / light -- 浅色主题 / ocean -- 海洋或蓝色主题 / mac -- Mac 风格主题 / mac light -- Mac 的浅色主题 / false -- 不适用定制主题，可自定义主题
# highlight_copy: true # copy button    启用或禁用代码块的复制按钮，需填写bool
# highlight_lang: true # show the code language
# highlight_shrink: false # true: shrink the code blocks / false: expand the code blocks | none: expand code blocks and hide the button， 如果设置成true，则不显示代码块，需要手动点击'>'才会出现代码块；如果设置false，则显示部分代码块，需要按下'<'才显示全部代码块；如果设置成no，则会完全显示全部代码块，并且不出现'<'
# highlight_height_limit: false # unit: px        只需要填写数值即可，如 ： highlight_height_limit: 30   或者直接填写false -- 代表不启动此功能
# code_word_wrap: true # 开启代码块的自动换行，需要填写bool  


