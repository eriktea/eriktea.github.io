menu:
  主页: / || fas fa-star
  学习: /study/ || fas fa-book-open
  软件: /software/ || fas fa-gamepad
  ACG: /ACG/ || fas fa-wand-magic-sparkles
  留言: /messageboard/ || fa-fw fas fa-comment-dots
  文档 || fa-fw fas fa-book:
    归档: /archives/ || fas fa-clock-rotate-left
    标签: /tags/ || fas fa-bookmark
    分类: /categories/ || fas fa-layer-group
  媒体 || fas fa-list:
    图库: /gallery/ || fa-fw fas fa-images
