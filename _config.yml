# -----------------------------自己添加的功能--------------------

# 在根目录 _config.yml 文件末尾添加
encrypt:
  enable: true
  kdf:
    iterations: 600000 # 将这里改为 600000，警告就会消失
  abstract: "这是一篇加密文章，请输入密码查看。" # 默认摘要
  message: "请输入密码查看此文章。"            # 输入框提示
  wrong_pass_message: "密码错误，请重试。"    # 密码错误提示



