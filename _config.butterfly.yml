#   enable: true
#   position: top-right # 弹窗位置：可选 top-left / top-right / bottom-left / bottom-right
#   bg_light: "#49b1f5"  # 白天模式弹窗主色
#   bg_dark: "#2c2c2c"   # 暗黑模式弹窗主色

# # 📄 [新功能 2] 智能版权保护（复制自动带上小尾巴）
# # 别人复制你博客的内容超过一定字数时，会自动在其剪贴板文字末尾加上版权声明
# copyright:
#   enable: true
#   triggerLength: 30    # 触发字数：复制超过 30 个字就自动追加版权
#   author: 一只香企鹅    # 你的名字

# # 🎨 [新功能 3] 全站中文字体美化（可选，让整体视觉更柔和高级）
